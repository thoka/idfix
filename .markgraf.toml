# The help documents (step 3y189RRB): watched so that mg fill-ids gives their temporary ids, and of the kind help, so
# that mg commit-check checks each one as a graph.
watch = ["src/help/*.md"]

[kinds]
"src/help/*.md" = ["help"]

[penalties]
file-link = 8
term-marker = 0
direct-access = 0
color-word = 21

[color-exceptions]
"src/top/view-model.ts" = "display code of idfx top: it maps each state to the Ink color of its row"
"src/top/view.tsx" = "display code of idfx top: it draws the rows in their Ink colors"
