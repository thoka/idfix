[tools]
bun = "1.4.2"
opencode = "1.18.32"
"github:docker/sbx-releases" = "0.45.1"
claude = { version = "latest", minimum_release_age = "0" }
# Git hooks: pre-push runs the tests (global rules, section Git).
lefthook = "2.1.16"

[tasks.test]
description = "Install the locked packages, then type-check and run the tests"
# A fresh worktree has no node_modules, and a merge can add a package to
# bun.lock. So the install runs each time: bun compares node_modules with the
# lockfile, and with no change it takes a few milliseconds. Without this
# install, a test step can leave a partial node_modules, and the Ink tests
# then fail with two copies of React.
run = [
  "bun install --frozen-lockfile",
  "bun run typecheck",
  "bun test",
]

[tasks.hooks-install]
description = "Install the git hooks of lefthook.yml (pre-commit: public-check, pre-push: mise run test)"
run = "lefthook install"

[tasks.doctor]
description = "Run idfx doctor of this checkout with the given arguments (mise run -q doctor -- --json)"
run = "bun run src/cli.ts doctor"
